<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="IBM Plex Sans, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14284F"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8561F"/></marker></defs>
<rect width="1040" height="470" fill="#fff"/><rect x="8" y="8" width="1024" height="196" rx="10" fill="#F7F9FC" stroke="#D5DCE6" stroke-width="1.2"/><text x="1018" y="32" text-anchor="end" font-size="13" font-weight="700" fill="#5A6476" letter-spacing=".08em">SHIP ROLL MODEL</text><rect x="22" y="52" width="150" height="58" rx="8" fill="#FFF4EC" stroke="#C8561F" stroke-width="1.8"/><text x="97.0" y="77.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">Wave moment</text><text x="97.0" y="96.0" text-anchor="middle" font-size="12.5" fill="#5A6476">regular waves</text><circle cx="220" cy="81" r="15" fill="#fff" stroke="#14284F" stroke-width="1.8"/><text x="220" y="87" text-anchor="middle" font-size="18" font-weight="600" fill="#14284F">Σ</text><text x="194" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#C8561F">+</text><text x="232" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#C8561F">+</text><text x="205" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#C8561F">−</text><text x="238" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#C8561F">−</text><path d="M172 81 L205 81" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="272" y="52" width="170" height="58" rx="8" fill="#EEF3FB" stroke="#14284F" stroke-width="1.8"/><text x="357.0" y="77.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">÷ Inertia</text><text x="357.0" y="96.0" text-anchor="middle" font-size="12.5" fill="#5A6476">ship + added water</text><path d="M235 81 L272 81" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="466" y="72" text-anchor="middle" font-size="12" font-weight="400" fill="#5A6476">accel.</text><rect x="490" y="52" width="130" height="58" rx="8" fill="#EEF3FB" stroke="#14284F" stroke-width="1.8"/><text x="555.0" y="77.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">∫ Integrate</text><text x="555.0" y="96.0" text-anchor="middle" font-size="12.5" fill="#5A6476">→ roll speed</text><path d="M442 81 L490 81" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="676" y="52" width="130" height="58" rx="8" fill="#EEF3FB" stroke="#14284F" stroke-width="1.8"/><text x="741.0" y="77.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">∫ Integrate</text><text x="741.0" y="96.0" text-anchor="middle" font-size="12.5" fill="#5A6476">→ roll angle φ</text><path d="M620 81 L676 81" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><path d="M806 81 L1010 81" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="1016" y="86" text-anchor="start" font-size="17" font-weight="700" fill="#14284F">φ</text><rect x="490" y="132" width="150" height="52" rx="8" fill="#EEF3FB" stroke="#14284F" stroke-width="1.8"/><text x="565.0" y="154.0" text-anchor="middle" font-size="14" font-weight="600" fill="#14284F">× Damping B</text><text x="565.0" y="173.0" text-anchor="middle" font-size="11.5" fill="#5A6476">water resists speed</text><rect x="676" y="132" width="170" height="52" rx="8" fill="#EEF3FB" stroke="#14284F" stroke-width="1.8"/><text x="761.0" y="154.0" text-anchor="middle" font-size="14" font-weight="600" fill="#14284F">× Stiffness C</text><text x="761.0" y="173.0" text-anchor="middle" font-size="11.5" fill="#5A6476">buoyancy rights ship</text><circle cx="648" cy="81" r="3.5" fill="#14284F"/><path d="M648 81 L648 114 L565 114 L565 132" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="870" cy="81" r="3.5" fill="#14284F"/><path d="M870 81 L870 114 L761 114 L761 132" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><path d="M490 158 L212 158 L212 96" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><path d="M761 184 L761 195 L228 195 L228 96" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="8" y="222" width="1024" height="240" rx="10" fill="#F7F9FC" stroke="#D5DCE6" stroke-width="1.2"/><text x="1018" y="246" text-anchor="end" font-size="13" font-weight="700" fill="#5A6476" letter-spacing=".08em">FIN CONTROLLER AND FORCE</text><rect x="40" y="268" width="170" height="58" rx="8" fill="#E3F1E8" stroke="#2E7D4F" stroke-width="1.8"/><text x="125.0" y="293.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">Controller gain −K</text><text x="125.0" y="312.0" text-anchor="middle" font-size="12.5" fill="#5A6476">fin angle = −K × roll</text><circle cx="940" cy="81" r="3.5" fill="#14284F"/><path d="M940 81 L940 213 L24 213 L24 297 L40 297" fill="none" stroke="#2E7D4F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="500" y="232" text-anchor="middle" font-size="12.5" font-weight="400" fill="#2E7D4F">measured roll angle φ → controller</text><rect x="250" y="268" width="150" height="58" rx="8" fill="#EEF3FB" stroke="#14284F" stroke-width="1.8"/><text x="325.0" y="293.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">Angle limit</text><text x="325.0" y="312.0" text-anchor="middle" font-size="12.5" fill="#5A6476">±40° saturation</text><path d="M210 297 L250 297" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="440" y="268" width="160" height="58" rx="8" fill="#EEF3FB" stroke="#14284F" stroke-width="1.8"/><text x="520.0" y="293.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">Speed limit</text><text x="520.0" y="312.0" text-anchor="middle" font-size="12.5" fill="#5A6476">±50°/s rate limiter</text><path d="M400 297 L440 297" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="640" y="268" width="140" height="58" rx="8" fill="#EEF3FB" stroke="#14284F" stroke-width="1.8"/><text x="710.0" y="293.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">d/dt</text><text x="710.0" y="312.0" text-anchor="middle" font-size="12.5" fill="#5A6476">fin angle → speed ω</text><path d="M600 297 L640 297" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="820" y="268" width="140" height="58" rx="8" fill="#EEF3FB" stroke="#14284F" stroke-width="1.8"/><text x="890.0" y="293.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">d/dt</text><text x="890.0" y="312.0" text-anchor="middle" font-size="12.5" fill="#5A6476">speed → accel. ω̇</text><path d="M780 297 L820 297" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><rect x="560" y="378" width="260" height="62" rx="8" fill="#FFF7E0" stroke="#B7862A" stroke-width="1.8"/><text x="690.0" y="405.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">Paddle force (Liang)</text><text x="690.0" y="424.0" text-anchor="middle" font-size="12.5" fill="#5A6476">F = ρ(K₁·ω|ω| + K₂·ω̇)</text><path d="M890 326 L890 409 L820 409" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="800" cy="297" r="3.5" fill="#14284F"/><path d="M800 297 L800 356 L700 356 L700 378" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><text x="870" y="370" text-anchor="end" font-size="12" font-weight="400" fill="#5A6476">fin speed also feeds drag</text><rect x="250" y="382" width="190" height="58" rx="8" fill="#EEF3FB" stroke="#14284F" stroke-width="1.8"/><text x="345.0" y="407.0" text-anchor="middle" font-size="15" font-weight="600" fill="#14284F">× 2 fins × 5.7 m</text><text x="345.0" y="426.0" text-anchor="middle" font-size="12.5" fill="#5A6476">force → roll moment</text><path d="M560 411 L440 411" fill="none" stroke="#14284F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a)"/><path d="M250 411 L186 411 L186 34 L220 34 L220 66" fill="none" stroke="#C8561F" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ao)"/><text x="118" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#C8561F">fin moment</text><text x="118" y="420" text-anchor="middle" font-size="12" font-weight="400" fill="#C8561F">back into ship</text></svg>